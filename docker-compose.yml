services:
  postgres:
    container_name: nest-clean-pg
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: next-clean
      PG_DATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres
  cache:
    container_name: nest-clean-cache
    image: bitnami/redis
    ports:
      - 6379:6379
    environment:
      REDIS_PASSWORD: redis
    volumes:
      - ./data/redis:/data
